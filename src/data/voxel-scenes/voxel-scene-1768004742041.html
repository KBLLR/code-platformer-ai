<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLX Atlas Voxel Scene</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #3b82f6; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; font-size: 24px; font-weight: bold;
            pointer-events: none;
        }
    </style>
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
      #info, #loading, #ui, #instructions, .label, .overlay, #description {
        display: none !important; opacity: 0 !important;
        pointer-events: none !important; visibility: hidden !important;
      }
      body { user-select: none !important; }
    </style>
  </head>
<body>
    <div id="loading">Generating Voxel World...</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // --- Configuration ---
        const VOXEL_SIZE = 0.5;
        const GAP = 0.05; // Gap between voxels for that distinct look
        const TOTAL_SIZE = VOXEL_SIZE + GAP;
        
        // Colors from the image
        const COLORS = {
            bgTop: 0x60a5fa,
            bgBottom: 0x1d4ed8,
            discLeft: 0xdbeafe, // Light blue
            discCenter: 0xe0f2fe, // Slightly lighter
            discRight: 0xdbeafe,
            textDark: 0x1e3a8a,
            textHighlight: 0x000000
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#87CEEB");
        scene.fog = new THREE.Fog(COLORS.bgTop, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 28);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight("#FFFFFF", 1);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight("#FFFFFF", 1);
        dirLight.position.set(50, 50, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x60a5fa, 0.8);
        fillLight.position.set(-10, 5, 10);
        scene.add(fillLight);

        // --- Voxel Generation Logic ---

        // Reusable geometry and material for InstancedMesh
        const boxGeometry = new THREE.BoxGeometry(VOXEL_SIZE, VOXEL_SIZE, VOXEL_SIZE);
        // Add a slight bevel effect using normal map or just good lighting. 
        // For pure voxel look, standard material is fine.
        const boxMaterial = new THREE.MeshStandardMaterial({ 
            roughness: 0.2, 
            metalness: 0.1 
        });

        function createVoxelDisc(radiusInVoxels, centerX, colorHex) {
            const voxels = [];
            const r2 = radiusInVoxels * radiusInVoxels;

            for (let x = -radiusInVoxels; x <= radiusInVoxels; x++) {
                for (let y = -radiusInVoxels; y <= radiusInVoxels; y++) {
                    if (x*x + y*y <= r2) {
                        // Create 2 layers of thickness
                        voxels.push({ x: centerX + (x * TOTAL_SIZE), y: y * TOTAL_SIZE, z: 0 });
                        voxels.push({ x: centerX + (x * TOTAL_SIZE), y: y * TOTAL_SIZE, z: -TOTAL_SIZE });
                    }
                }
            }
            
            const mesh = new THREE.InstancedMesh(boxGeometry, boxMaterial.clone(), voxels.length);
            mesh.material.color.setHex(colorHex);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            const dummy = new THREE.Object3D();
            for (let i = 0; i < voxels.length; i++) {
                dummy.position.set(voxels[i].x, voxels[i].y, voxels[i].z);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            }
            
            return mesh;
        }

        // --- Text Generation Logic ---
        const fontLoader = new FontLoader();
        
        function create3DText(text, size, height, color, pos) {
            return new Promise((resolve) => {
                fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', (font) => {
                    const geometry = new TextGeometry(text, {
                        font: font,
                        size: size,
                        height: height,
                        curveSegments: 4,
                        bevelEnabled: false
                    });
                    
                    geometry.center();
                    const material = new THREE.MeshStandardMaterial({ color: color });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.copy(pos);
                    mesh.castShadow = true;
                    resolve(mesh);
                });
            });
        }

        // --- Build Scene Elements ---

        // Groups to hold discs and text for animation
        const groupLeft = new THREE.Group();
        const groupCenter = new THREE.Group();
        const groupRight = new THREE.Group();

        // 1. Left Circle (MLX)
        const discLeft = createVoxelDisc(8, 0, COLORS.discLeft);
        groupLeft.add(discLeft);
        groupLeft.position.set(-10, 0, 0);

        // 2. Center Circle (Atlas/David) - Slightly larger
        const discCenter = createVoxelDisc(9, 0, COLORS.discCenter);
        groupCenter.add(discCenter);
        groupCenter.position.set(0, 0, 1); // Slight Z offset to overlap visually

        // 3. Right Circle (Atlas)
        const discRight = createVoxelDisc(8, 0, COLORS.discRight);
        groupRight.add(discRight);
        groupRight.position.set(10, 0, 0);

        scene.add(groupLeft);
        scene.add(groupCenter);
        scene.add(groupRight);

        // Add Floating Particles
        const particlesCount = 100;
        const particleGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
        const particles = new THREE.InstancedMesh(particleGeo, particleMat, particlesCount);
        const dummy = new THREE.Object3D();
        
        for(let i=0; i<particlesCount; i++) {
            dummy.position.set(
                (Math.random() - 0.5) * 40,
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 10 - 5
            );
            dummy.rotation.set(Math.random(), Math.random(), Math.random());
            dummy.updateMatrix();
            particles.setMatrixAt(i, dummy.matrix);
        }
        scene.add(particles);


        // --- Load Text Asynchronously ---
        async function buildText() {
            const zOffset = 0.6; // In front of voxels
            
            // LEFT
            const t1 = await create3DText("1076", 2.5, 0.2, COLORS.textHighlight, new THREE.Vector3(0, 0, zOffset));
            const t2 = await create3DText("DAYS AGO", 0.6, 0.1, COLORS.textDark, new THREE.Vector3(0, -2.5, zOffset));
            const t3 = await create3DText("MLX", 0.6, 0.1, COLORS.textDark, new THREE.Vector3(0, 2.5, zOffset));
            groupLeft.add(t1, t2, t3);

            // CENTER
            const t4 = await create3DText("DAVID", 1.2, 0.2, COLORS.textHighlight, new THREE.Vector3(0, 1, zOffset));
            const t5 = await create3DText("CABALLERO", 1.2, 0.2, COLORS.textHighlight, new THREE.Vector3(0, -1, zOffset));
            
            // Add wireframe globe effect behind text
            const sphereGeo = new THREE.IcosahedronGeometry(4, 1);
            const wireframeGeo = new THREE.WireframeGeometry(sphereGeo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
            const globeLines = new THREE.LineSegments(wireframeGeo, lineMat);
            globeLines.position.z = -0.5;
            groupCenter.add(globeLines, t4, t5);

            // RIGHT
            const t6 = await create3DText("1", 2.5, 0.2, COLORS.textHighlight, new THREE.Vector3(0, 0, zOffset));
            const t7 = await create3DText("MINUTE AGO", 0.6, 0.1, COLORS.textDark, new THREE.Vector3(0, -2.5, zOffset));
            const t8 = await create3DText("ATLAS", 0.6, 0.1, COLORS.textDark, new THREE.Vector3(0, 2.5, zOffset));
            groupRight.add(t6, t7, t8);

            document.getElementById('loading').style.display = 'none';
        }

        buildText();

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Gentle floating animation
            groupLeft.position.y = Math.sin(time) * 0.5;
            groupCenter.position.y = Math.sin(time * 0.8 + 1) * 0.5;
            groupRight.position.y = Math.sin(time * 1.2 + 2) * 0.5;

            // Rotate the globe wireframe
            const globe = groupCenter.children.find(c => c.type === 'LineSegments');
            if (globe) {
                globe.rotation.y += 0.005;
                globe.rotation.x += 0.002;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
