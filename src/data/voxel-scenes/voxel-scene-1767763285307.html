<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Voxel Art</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #001529; }
        canvas { display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            color: white; font-family: monospace; font-size: 1.5rem;
            pointer-events: none;
        }
    </style>
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
      /* Hides common overlay IDs and classes used in Three.js examples and generated code */
      #info, #loading, #ui, #instructions, .label, .overlay, #description {
        display: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
        visibility: hidden !important;
      }
      /* Ensure the body doesn't show selected text cursor interaction outside canvas */
      body {
        user-select: none !important;
      }
    </style>
  </head>
<body>
    <div id="loading">Generating Voxels...</div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const CONFIG = {
            gridSize: 90, // Resolution of the voxel grid
            scale: 0.8, // Size of individual voxels
            spacing: 0.85, // Spacing to create slight gaps or overlaps
            colors: {
                white: new THREE.Color('#fdfdfd'),
                offWhite: new THREE.Color('#e0e7ee'),
                lightBlue: new THREE.Color('#8ecae6'),
                midBlue: new THREE.Color('#219ebc'),
                deepBlue: new THREE.Color('#023e8a'),
                darkestBlue: new THREE.Color('#001219'),
                skinShadow: new THREE.Color('#dbe4eb')
            }
        };

        // --- Simple Noise Implementation (Perlin-ish) ---
        // Embedded to keep single-file structure without external math deps
        class PseudoNoise {
            constructor() {
                this.p = new Uint8Array(512);
                const p = new Uint8Array(256);
                for(let i=0; i<256; i++) p[i] = i;
                // Shuffle
                for(let i=255; i>0; i--) {
                    const r = Math.floor(Math.random() * (i+1));
                    [p[i], p[r]] = [p[r], p[i]];
                }
                for(let i=0; i<512; i++) this.p[i] = p[i & 255];
            }
            fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
            lerp(t, a, b) { return a + t * (b - a); }
            grad(hash, x, y, z) {
                const h = hash & 15;
                const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            }
            noise(x, y, z) {
                const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
                x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
                const u = this.fade(x), v = this.fade(y), w = this.fade(z);
                const A = this.p[X] + Y, AA = this.p[A] + Z, AB = this.p[A + 1] + Z,
                      B = this.p[X + 1] + Y, BA = this.p[B] + Z, BB = this.p[B + 1] + Z;
                return this.lerp(w, this.lerp(v, this.lerp(u, this.grad(this.p[AA], x, y, z),
                    this.grad(this.p[BA], x - 1, y, z)),
                    this.lerp(u, this.grad(this.p[AB], x, y - 1, z),
                    this.grad(this.p[BB], x - 1, y - 1, z))),
                    this.lerp(v, this.lerp(u, this.grad(this.p[AA + 1], x, y, z - 1),
                    this.grad(this.p[BA + 1], x - 1, y, z - 1)),
                    this.lerp(u, this.grad(this.p[AB + 1], x, y - 1, z - 1),
                    this.grad(this.p[BB + 1], x - 1, y - 1, z - 1))));
            }
        }
        
        const noiseGen = new PseudoNoise();

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#051d3b'); // Deep ocean background
        scene.fog = new THREE.FogExp2('#051d3b', 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 56);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // --- Lighting ---
        const ambientLight = new THREE.HemisphereLight(0xffffff, 0x000000, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, 30, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0x4488ff, 0.8);
        backLight.position.set(-20, 10, -20);
        scene.add(backLight);

        // --- Voxel Generation Logic ---

        const voxelData = [];
        const dummy = new THREE.Object3D();
        const geometry = new THREE.BoxGeometry(CONFIG.scale, CONFIG.scale, CONFIG.scale);
        // Beveling edges slightly for a smoother "art toy" look (simulated via material or just simple cubes)
        // Sticking to simple cubes for performance on high count
        
        const material = new THREE.MeshStandardMaterial({ 
            roughness: 0.3, 
            metalness: 0.1 
        });

        function getVoxelColor(x, y, z, noiseVal, isFace, isMask, isLips) {
            if (isLips) return CONFIG.colors.midBlue;
            if (isMask) {
                // Gradient within the mask
                return y > 1 ? CONFIG.colors.deepBlue : CONFIG.colors.midBlue;
            }
            if (isFace) {
                // Subtle shading for face
                return (z < 2 || y < -4) ? CONFIG.colors.skinShadow : CONFIG.colors.white;
            }

            // Hair/Water Swirls logic
            // Use noise value to determine color layers (resembling the cutout style)
            if (noiseVal > 0.65) return CONFIG.colors.white;
            if (noiseVal > 0.35) return CONFIG.colors.offWhite;
            if (noiseVal > 0.1) return CONFIG.colors.lightBlue;
            if (noiseVal > -0.2) return CONFIG.colors.midBlue;
            return CONFIG.colors.deepBlue;
        }

        function generateScene() {
            const range = CONFIG.gridSize / 2;
            const limit = 22; // Physical bounds of the generation

            for (let x = -limit; x <= limit; x += CONFIG.spacing) {
                for (let y = -limit; y <= limit; y += CONFIG.spacing) {
                    for (let z = -10; z <= 15; z += CONFIG.spacing) {
                        
                        // 1. Face Shape Logic (Ellipsoid)
                        const faceX = x * 1.0;
                        const faceY = (y + 2) * 1.2; // Stretch vertically
                        const faceZ = z * 1.2;
                        
                        // Main head shape
                        const headDist = Math.sqrt(faceX*faceX + faceY*faceY + faceZ*faceZ);
                        const isHead = headDist < 8.5;

                        // Features
                        const isEyeArea = isHead && z > 5 && Math.abs(y - 1) < 1.8 && Math.abs(x) < 5;
                        const isMask = isEyeArea && Math.abs(x) > 1.0; // Cut out bridge of nose slightly
                        const isLips = isHead && z > 5.5 && Math.abs(y + 3.5) < 0.8 && Math.abs(x) < 2.5;

                        // Sculpting cuts
                        // Hollow out neck area slightly
                        const neckCut = y < -6 && Math.abs(x) > 3.5;
                        
                        // 2. Swirling Hair/Water Logic (Noise)
                        // Twist coordinates for swirling effect
                        const twistScale = 0.08;
                        const twistX = x + Math.sin(y * 0.1) * 2;
                        const twistY = y + Math.cos(x * 0.1) * 2;
                        
                        const n1 = noiseGen.noise(twistX * twistScale, twistY * twistScale, z * twistScale);
                        const n2 = noiseGen.noise(x * 0.15, y * 0.15, z * 0.15 + 100); // Detail noise
                        
                        // Combine noises
                        const combinedNoise = n1 + (n2 * 0.3);
                        
                        // Shape the hair volume
                        const hairDist = Math.sqrt(x*x + y*y + (z-2)*(z-2));
                        const hairVolume = hairDist < 25 && hairDist > 8; 
                        
                        // Create strands
                        const isHair = hairVolume && (Math.sin(combinedNoise * 10) > 0.2);

                        // 3. Bubbles (Spheres)
                        const bubbleNoise = noiseGen.noise(x*0.4, y*0.4, z*0.4);
                        const isBubble = !isHead && !isHair && bubbleNoise > 0.75 && Math.abs(z) < 5;

                        // --- Decision Tree ---
                        let shouldRender = false;
                        let color = CONFIG.colors.white;

                        if (isHead && !neckCut) {
                            // Carve out eyes sockets slightly
                            if (isEyeArea && z > 6.8) {
                                shouldRender = false; // Hollow
                            } else {
                                shouldRender = true;
                                color = getVoxelColor(x, y, z, 1, true, isMask, isLips);
                                
                                // Iris pupils
                                if (isMask && Math.abs(x) > 2 && Math.abs(x) < 3.5 && z > 6.2) {
                                     color = CONFIG.colors.darkestBlue;
                                }
                            }
                        } else if (isHair) {
                            shouldRender = true;
                            color = getVoxelColor(x, y, z, combinedNoise, false, false, false);
                        } else if (isBubble) {
                            shouldRender = true;
                            color = CONFIG.colors.white;
                        }

                        // Add to list
                        if (shouldRender) {
                            voxelData.push({ x, y, z, color });
                        }
                    }
                }
            }
            createInstancedMesh();
        }

        function createInstancedMesh() {
            const count = voxelData.length;
            const mesh = new THREE.InstancedMesh(geometry, material, count);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            for (let i = 0; i < count; i++) {
                const d = voxelData[i];
                dummy.position.set(d.x, d.y, d.z);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
                mesh.setColorAt(i, d.color);
            }

            mesh.instanceMatrix.needsUpdate = true;
            mesh.instanceColor.needsUpdate = true;
            scene.add(mesh);

            document.getElementById('loading').style.display = 'none';
        }

        // --- Execute Generation ---
        // Give browser a split second to render loading text
        setTimeout(generateScene, 100);

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
