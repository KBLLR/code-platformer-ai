<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agent Dossier</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <script
            type="module"
            src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"
        ></script>
        <style>
            :root {
                color-scheme: dark;
                --bg: #020617;
                --panel: rgba(8, 15, 31, 0.82);
                --panel-border: rgba(148, 163, 184, 0.14);
                --text: #f8fafc;
                --muted: #94a3b8;
                --shadow: 0 34px 100px rgba(2, 6, 23, 0.45);
                --accent: #38bdf8;
                --accent-soft: rgba(56, 189, 248, 0.2);
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: "Space Grotesk", sans-serif;
                color: var(--text);
                background:
                    radial-gradient(circle at top left, var(--accent-soft), transparent 32%),
                    radial-gradient(circle at bottom right, rgba(249, 115, 22, 0.14), transparent 28%),
                    linear-gradient(180deg, #081121 0%, #030712 64%, #020617 100%);
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
                background-size: 48px 48px;
                mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.48), transparent 78%);
                pointer-events: none;
            }

            .shell {
                position: relative;
                width: min(1220px, calc(100% - 32px));
                margin: 0 auto;
                padding: 26px 0 48px;
            }

            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                margin-bottom: 28px;
            }

            .brand {
                display: inline-flex;
                align-items: center;
                gap: 14px;
                padding: 12px 18px;
                border-radius: 999px;
                border: 1px solid rgba(148, 163, 184, 0.14);
                background: rgba(8, 15, 31, 0.72);
                box-shadow: var(--shadow);
                backdrop-filter: blur(18px);
            }

            .brand-badge {
                display: grid;
                place-items: center;
                width: 42px;
                height: 42px;
                border-radius: 14px;
                color: #020617;
                background: linear-gradient(135deg, var(--accent), #fb923c);
            }

            .brand-copy {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }

            .brand-copy strong {
                font-size: 0.92rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .brand-copy span,
            .nav a,
            .meta,
            .kicker {
                font-family: "IBM Plex Mono", monospace;
            }

            .brand-copy span {
                color: var(--muted);
                font-size: 0.76rem;
            }

            .nav {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }

            .nav a {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                padding: 12px 16px;
                border-radius: 999px;
                border: 1px solid rgba(148, 163, 184, 0.16);
                background: rgba(8, 15, 31, 0.64);
                color: var(--text);
                text-decoration: none;
                font-size: 0.76rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .layout {
                display: grid;
                grid-template-columns: minmax(320px, 1.05fr) minmax(320px, 0.95fr);
                gap: 24px;
            }

            .stage,
            .panel,
            .prompt-panel,
            .status-panel {
                position: relative;
                overflow: hidden;
                border-radius: 28px;
                border: 1px solid var(--panel-border);
                background: var(--panel);
                box-shadow: var(--shadow);
                backdrop-filter: blur(18px);
            }

            .stage::after,
            .panel::after,
            .prompt-panel::after,
            .status-panel::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(140deg, transparent 40%, rgba(255, 255, 255, 0.04));
                pointer-events: none;
            }

            .stage {
                min-height: 620px;
                padding: 24px;
                background:
                    radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 34%),
                    linear-gradient(180deg, rgba(15, 23, 42, 0.86), rgba(2, 6, 23, 0.96));
            }

            model-viewer {
                width: 100%;
                min-height: 572px;
                height: 100%;
                --poster-color: transparent;
            }

            .viewer-fallback {
                display: grid;
                place-items: center;
                gap: 14px;
                min-height: 572px;
                text-align: center;
                color: #cbd5e1;
                padding: 28px;
            }

            .viewer-fallback i {
                font-size: 3rem;
                color: var(--accent);
            }

            .sidebar {
                display: grid;
                gap: 20px;
            }

            .panel {
                padding: 30px;
            }

            .kicker {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                color: #cbd5e1;
                font-size: 0.76rem;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }

            .kicker::before {
                content: "";
                width: 42px;
                height: 1px;
                background: linear-gradient(90deg, var(--accent), transparent);
            }

            h1 {
                margin: 16px 0 12px;
                font-size: clamp(2.4rem, 4.5vw, 4.8rem);
                line-height: 0.94;
                letter-spacing: -0.05em;
            }

            .mission {
                margin: 0;
                color: #dbeafe;
                font-size: 1.04rem;
                line-height: 1.72;
            }

            .meta-row,
            .status-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }

            .status-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }

            .pill,
            .status-item {
                border-radius: 20px;
                border: 1px solid rgba(148, 163, 184, 0.12);
                background: rgba(15, 23, 42, 0.66);
            }

            .pill {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                min-height: 40px;
                padding: 8px 14px;
                color: #e2e8f0;
                font-size: 0.82rem;
            }

            .color-chip {
                width: 10px;
                height: 10px;
                border-radius: 999px;
            }

            .quote {
                margin: 20px 0 0;
                padding: 22px;
                border-radius: 22px;
                background: rgba(15, 23, 42, 0.72);
                border: 1px solid rgba(148, 163, 184, 0.12);
                color: #e2e8f0;
                line-height: 1.72;
                font-size: 1.04rem;
            }

            .quote::before {
                content: '"';
                margin-right: 8px;
                color: var(--accent);
                font-size: 1.4rem;
                font-weight: 700;
            }

            .status-panel,
            .prompt-panel {
                padding: 24px 26px;
            }

            .status-item {
                padding: 16px;
            }

            .status-item span {
                display: block;
                color: var(--muted);
                font-size: 0.78rem;
                text-transform: uppercase;
                letter-spacing: 0.12em;
            }

            .status-item strong {
                display: block;
                margin-top: 10px;
                font-size: 1rem;
                line-height: 1.45;
            }

            .prompt-body {
                margin: 16px 0 0;
                color: #dbeafe;
                font-size: 0.98rem;
                line-height: 1.75;
                white-space: pre-wrap;
            }

            .error-shell {
                display: grid;
                place-items: center;
                min-height: 100vh;
                padding: 24px;
            }

            .error-card {
                width: min(560px, 100%);
                padding: 32px;
                border-radius: 28px;
                border: 1px solid var(--panel-border);
                background: rgba(8, 15, 31, 0.88);
                box-shadow: var(--shadow);
                text-align: center;
            }

            .error-card p {
                color: var(--muted);
                line-height: 1.7;
            }

            .error-card a {
                color: #f8fafc;
            }

            @media (max-width: 980px) {
                .layout {
                    grid-template-columns: 1fr;
                }

                .stage {
                    min-height: 420px;
                }

                model-viewer,
                .viewer-fallback {
                    min-height: 360px;
                }
            }

            @media (max-width: 720px) {
                .shell {
                    width: min(100% - 24px, 1220px);
                    padding-top: 20px;
                }

                .topbar {
                    align-items: stretch;
                    flex-direction: column;
                }

                .panel,
                .status-panel,
                .prompt-panel,
                .stage {
                    padding: 22px;
                }
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <script type="module">
            const profileModules = import.meta.glob("./agents/profiles/*.json", { eager: true });
            const modelModules = import.meta.glob("./agents/profiles/models/*.{glb,gltf}", {
                eager: true,
                query: "?url",
            });

            const moduleValue = (mod) =>
                mod && typeof mod === "object" && "default" in mod ? mod.default : mod;

            const fileNameFromPath = (value) => value.split("/").pop();
            const escapeHtml = (value = "") =>
                value
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#39;");

            const modelUrlByFile = new Map(
                Object.entries(modelModules).map(([path, mod]) => [fileNameFromPath(path), moduleValue(mod)]),
            );

            const profilesByFile = new Map(
                Object.entries(profileModules).map(([path, mod]) => {
                    const data = moduleValue(mod);
                    return [
                        fileNameFromPath(path),
                        {
                            ...data,
                            __fileName: fileNameFromPath(path),
                            __modelUrl: data.model3D ? modelUrlByFile.get(data.model3D) ?? null : null,
                        },
                    ];
                }),
            );

            const params = new URLSearchParams(window.location.search);
            const requestedProfile = params.get("profile");
            const profile =
                (requestedProfile && profilesByFile.get(requestedProfile)) ||
                Array.from(profilesByFile.values())[0] ||
                null;

            const app = document.getElementById("app");

            if (!profile) {
                app.innerHTML = `
                    <div class="error-shell">
                        <div class="error-card">
                            <h1 style="font-size:2rem; margin-top:0;">No agent dossier available.</h1>
                            <p>Add at least one JSON profile under <code>agents/profiles/</code>, then reload the page.</p>
                            <p><a href="/agent-gallery.html">Return to gallery</a></p>
                        </div>
                    </div>
                `;
            } else {
                const accent = escapeHtml(profile.favoriteColor || "#38bdf8");
                document.documentElement.style.setProperty("--accent", accent);
                document.documentElement.style.setProperty("--accent-soft", `${accent}33`);
                document.title = `${profile.name || "Agent"} Dossier`;

                const name = escapeHtml(profile.name || profile.__fileName.replace(/\.json$/i, ""));
                const provider = escapeHtml(profile.provider || "Unknown provider");
                const favoriteAnimal = escapeHtml(profile.favoriteAnimal || "Unknown spirit animal");
                const favoriteColor = escapeHtml(profile.favoriteColor || "#38bdf8");
                const quote = escapeHtml(profile.quote || "Awaiting debrief.");
                const taskCompleted = escapeHtml(profile.taskCompleted || "Mission data pending.");
                const completedDate = escapeHtml(profile.completedDate || "Unknown date");
                const agentId = escapeHtml(
                    profile.agentId || profile.__fileName.replace(/\.json$/i, "").replaceAll("-", " ").toUpperCase(),
                );
                const sunoPrompt = escapeHtml(profile.sunoPrompt?.yourPrompt || "Not provided.");
                const tencentPrompt = escapeHtml(profile.tencent3DPrompt?.yourPrompt || "Not provided.");
                const modelMarkup = profile.__modelUrl
                    ? `
                        <model-viewer
                            src="${profile.__modelUrl}"
                            alt="${name} 3D model"
                            auto-rotate
                            camera-controls
                            shadow-intensity="1"
                            exposure="0.98"
                            interaction-prompt="auto"
                            camera-orbit="0deg 75deg 2.8m"
                            min-camera-orbit="auto auto 1.4m"
                            max-camera-orbit="auto auto 8m"
                        ></model-viewer>
                    `
                    : `
                        <div class="viewer-fallback">
                            <i class="fa-solid fa-cubes"></i>
                            <div>
                                <strong>3D model unavailable</strong>
                                <p class="mission" style="margin-top:10px;">
                                    The profile references ${escapeHtml(profile.model3D || "no model file")}, but there is no
                                    matching asset in <code>agents/profiles/models/</code>.
                                </p>
                            </div>
                        </div>
                    `;

                app.innerHTML = `
                    <div class="shell">
                        <header class="topbar">
                            <div class="brand">
                                <div class="brand-badge">
                                    <i class="fa-solid fa-id-badge"></i>
                                </div>
                                <div class="brand-copy">
                                    <strong>${agentId}</strong>
                                    <span>Interactive dossier</span>
                                </div>
                            </div>
                            <nav class="nav">
                                <a href="/agent-gallery.html"><i class="fa-solid fa-grid-2"></i> Gallery</a>
                                <a href="/index.html"><i class="fa-solid fa-gamepad"></i> Game</a>
                            </nav>
                        </header>

                        <main class="layout">
                            <section class="stage">
                                ${modelMarkup}
                            </section>

                            <section class="sidebar">
                                <article class="panel">
                                    <div class="kicker">Mission Dossier</div>
                                    <h1>${name}</h1>
                                    <p class="mission">${taskCompleted}</p>
                                    <div class="meta-row" style="margin-top:18px;">
                                        <span class="pill meta"><i class="fa-solid fa-bolt"></i> ${provider}</span>
                                        <span class="pill meta"><span class="color-chip" style="background:${favoriteColor};"></span> ${favoriteColor}</span>
                                        <span class="pill meta"><i class="fa-solid fa-paw"></i> ${favoriteAnimal}</span>
                                    </div>
                                    <p class="quote">${quote}</p>
                                </article>

                                <article class="status-panel">
                                    <div class="kicker">Status</div>
                                    <div class="status-grid" style="margin-top:18px;">
                                        <div class="status-item">
                                            <span>Completed Date</span>
                                            <strong>${completedDate}</strong>
                                        </div>
                                        <div class="status-item">
                                            <span>Profile File</span>
                                            <strong>${escapeHtml(profile.__fileName)}</strong>
                                        </div>
                                        <div class="status-item">
                                            <span>Model Asset</span>
                                            <strong>${escapeHtml(profile.model3D || "None")}</strong>
                                        </div>
                                    </div>
                                </article>

                                <article class="prompt-panel">
                                    <div class="kicker">Suno Prompt</div>
                                    <p class="prompt-body">${sunoPrompt}</p>
                                </article>

                                <article class="prompt-panel">
                                    <div class="kicker">Tencent 3D Prompt</div>
                                    <p class="prompt-body">${tencentPrompt}</p>
                                </article>
                            </section>
                        </main>
                    </div>
                `;
            }
        </script>
    </body>
</html>
